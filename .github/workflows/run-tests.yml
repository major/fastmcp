name: Tests

env:
  PY_COLORS: 1

on:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "tests/**"
      - "uv.lock"
      - "pyproject.toml"
      - ".github/workflows/**"

  # run on all pull requests because these checks are required and will block merges otherwise
  pull_request:

  workflow_dispatch:

permissions:
  contents: read

jobs:
  run_tests:
    name: "Tests: Python ${{ matrix.python-version }} on ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10"]
        include:
          - os: ubuntu-latest
            python-version: "3.13"
      fail-fast: false
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Setup uv
        uses: ./.github/actions/setup-uv
        with:
          python-version: ${{ matrix.python-version }}
          resolution: locked

      - name: Run unit tests
        uses: ./.github/actions/run-pytest

      - name: Run client process tests
        uses: ./.github/actions/run-pytest
        with:
          test-type: client_process

  run_tests_lowest_direct:
    name: "Tests with lowest-direct dependencies"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Setup uv (lowest-direct)
        uses: ./.github/actions/setup-uv
        with:
          resolution: lowest-direct

      - name: Run unit tests
        uses: ./.github/actions/run-pytest

      - name: Run client process tests
        uses: ./.github/actions/run-pytest
        with:
          test-type: client_process

  run_integration_tests:
    name: "Integration tests"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Setup uv
        uses: ./.github/actions/setup-uv
        with:
          resolution: locked

      - name: Run integration tests
        uses: ./.github/actions/run-pytest
        with:
          test-type: integration
        env:
          FASTMCP_GITHUB_TOKEN: ${{ secrets.FASTMCP_GITHUB_TOKEN }}
          FASTMCP_TEST_AUTH_GITHUB_CLIENT_ID: ${{ secrets.FASTMCP_TEST_AUTH_GITHUB_CLIENT_ID }}
          FASTMCP_TEST_AUTH_GITHUB_CLIENT_SECRET: ${{ secrets.FASTMCP_TEST_AUTH_GITHUB_CLIENT_SECRET }}

  test_without_otel:
    name: "Tests without OpenTelemetry"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.10"

      - name: Install FastMCP without OTel extra
        run: uv pip install -e . --system

      - name: Verify OTel is not installed
        run: |
          python -c "import opentelemetry" && exit 1 || echo "PASS: OTel not installed"

      - name: Verify FastMCP imports successfully
        run: |
          python -c "from fastmcp import FastMCP; print('PASS: FastMCP imports')"

      - name: Verify OTEL_AVAILABLE is False
        run: |
          python -c "from fastmcp.telemetry import OTEL_AVAILABLE; assert not OTEL_AVAILABLE"

      - name: Verify server creation works
        run: |
          python -c "
          from fastmcp import FastMCP
          mcp = FastMCP('test')
          @mcp.tool
          def add(a: int, b: int) -> int:
              return a + b
          print('PASS: Server with tool created')
          "

      - name: Run non-telemetry tests
        run: |
          uv pip install pytest pytest-asyncio pytest-timeout --system
          python -m pytest tests/ -v --ignore=tests/telemetry --ignore=tests/server/telemetry --ignore=tests/client/telemetry --ignore=tests/integration_tests -x --timeout=30
